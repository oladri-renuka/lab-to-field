# Shared defaults. Every experiment config sets `_base_` to this file (directly or via another config)
# and overrides only what it changes. CLI overrides: `python -m src.train --config X.yaml model=vit_s16 seed=1`.
seed: 0
exp_id: base
model: efficientnet_b0
output_dir: runs

paths:
  raw_dir: data/raw
  processed_dir: data/processed
  plantdoc_dir: data/raw/PlantDoc-Dataset
  class_map: configs/class_map.csv
  generated_dir: data/generated
  backgrounds_dir: null        # null -> random crops of PlantDoc *train split* images (never val/test)

data:
  hf_id: mohanty/PlantVillage
  img_size: 224
  num_workers: 8
  val_frac: 0.2                # carved from PlantDoc train, stratified
  split_seed: 0                # fixed: the val split never changes across training seeds
  dedup_hamming: 4             # perceptual-hash Hamming distance for near-duplicates
  train_sources: [pv_color]    # pv_color | pv_composite | cyclegan | cvae | pd_fewshot | pd_train
  fewshot_k: null
  max_train_samples: null      # debug only

aug:
  kind: baseline               # baseline | strong
  mixup: false
  mixup_alpha: 0.2
  cutmix_alpha: 1.0
  mixup_switch_prob: 0.5

composite:
  canvas: 256
  leaf_scale: [0.45, 0.95]     # leaf long side as a fraction of the canvas
  rotation: 45
  leaf_blur: [0.0, 1.0]
  bg_blur: [0.0, 2.0]
  bg_crop_scale: [0.15, 0.6]
  bg_max_side: 512              # backgrounds are cached downsized to this (decode cost)
  mask_threshold: 12
  mask_repair: 7                # closing iterations + hole fill: restores lesions the segmentation cut away

models:
  resnet50:        {timm_name: resnet50.a1_in1k,                           lr: 3.0e-4}
  efficientnet_b0: {timm_name: efficientnet_b0.ra_in1k,                    lr: 3.0e-4}
  vit_s16:         {timm_name: vit_small_patch16_224.augreg_in21k_ft_in1k, lr: 1.0e-4}

train:
  epochs: 30
  warmup_epochs: 5
  batch_size: 128              # per GPU
  base_batch: 128              # reference batch for linear lr scaling
  scale_lr: true               # lr *= global_batch / base_batch
  lr_mult: 1.0
  weight_decay: 0.05
  label_smoothing: 0.1
  min_lr_ratio: 0.0
  early_stop_patience: 8       # epochs without PlantDoc-val improvement
  precision: bf16              # fp32 | bf16
  grad_checkpointing: false
  init_from: null
  pretrained: true             # ImageNet weights from timm; false only for offline smoke tests
  grad_clip: null
  log_every: 50
  deterministic: false

profile:
  enabled: false
  wait: 5
  warmup: 5
  active: 20

logging:
  backend: mlflow              # mlflow | wandb | none
  project: crop-disease-lab2field

eval:
  batch_size: 256
  ece_bins: 15
  bootstrap: 1000
