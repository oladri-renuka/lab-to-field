checkpoint: auto          # auto = the EfficientNet-B0 run with the best PlantDoc-VAL accuracy (never test); or a path
deploy_model: efficientnet_b0
export_dir: serve/artifacts
opset: 17
calibration_images: 500     # from PlantDoc *train split* (MinMax)
calibration_images_histogram: 128   # Percentile/Entropy keep all activations in RAM; 500 images exceed 50 GB
calibration_seed: 0
latency: {warmup: 50, iters: 500, threads: 4}
app: {unsure_threshold: 0.5, top_k: 3}
max_int8_val_drop: 0.03   # if the best INT8 variant loses more PlantDoc-val accuracy than this, the demo serves FP32
# INT8 variants tried; the one with the best PlantDoc-VAL accuracy is shipped (ties -> faster).
# ops: all = every op ONNX Runtime can quantize; conv = only Conv/Gemm/MatMul (SiLU, squeeze-excite stay float);
# conv_nodw = conv but depthwise (grouped) convolutions also stay float.
quant_variants:
  - {name: minmax_all,      method: MinMax,     ops: all}
  - {name: percentile_all,  method: Percentile, ops: all}
  - {name: entropy_all,     method: Entropy,    ops: all}
  - {name: minmax_conv,     method: MinMax,     ops: conv}
  - {name: percentile_conv, method: Percentile, ops: conv}
  - {name: entropy_conv,    method: Entropy,    ops: conv}
  - {name: percentile_conv_nodw, method: Percentile, ops: conv_nodw}   # depthwise convs stay FP32
